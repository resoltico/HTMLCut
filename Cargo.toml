# SPDX-License-Identifier: MPL-2.0
[workspace]
members = [
    "crates/htmlcut-core",
    "crates/htmlcut-cli",
    "crates/htmlcut-runtime",
    "fuzz",
]
default-members = [
    "crates/htmlcut-core",
    "crates/htmlcut-cli",
    "crates/htmlcut-runtime",
]
resolver = "3"

[workspace.package]
version = "23.0.0"
edition = "2024"
rust-version = "1.88.0"
description = "Fail-closed extraction contracts for caller-owned HTML snapshots, with complete compact results."
license = "MPL-2.0"
authors = ["Ervins Strauhmanis"]
repository = "https://github.com/resoltico/HTMLCut"

[workspace.dependencies]
schemars = "1.2.2"
serde_path_to_error = "0.1.20"
filedescriptor = "0.8.3"
libc = "0.2.189"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Threading"] }
winapi-util = "0.1.11"
clap = { version = "4.6.7", features = ["derive"] }
ego-tree = "0.11.0"
encoding_rs = "0.8.42"
precomputed-hash = "0.1.1"
cssparser = "0.37.0"
selectors = "0.38.0"
html5ever = "0.40.1"
tempfile = "3.27.0"
htmlcut-runtime = { path = "crates/htmlcut-runtime", version = "23.0.0" }
htmlcut-core = { path = "crates/htmlcut-core", version = "23.0.0" }
libfuzzer-sys = "0.4.13"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
