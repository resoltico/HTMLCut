# SPDX-License-Identifier: MPL-2.0
[workspace]
members = [
    "crates/htmlcut-core",
    "crates/htmlcut-cli",
    "fuzz",
]
default-members = [
    "crates/htmlcut-core",
    "crates/htmlcut-cli",
]
resolver = "3"

[workspace.package]
version = "22.0.0"
edition = "2024"
rust-version = "1.99.0"
description = "Fail-closed extraction contracts for caller-owned HTML snapshots, with complete compact results."
license = "MPL-2.0"
authors = ["Ervins Strauhmanis"]
repository = "https://github.com/resoltico/HTMLCut"

[workspace.dependencies]
libc = "0.2.186"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem"] }
arbitrary = { version = "1.4.2", features = ["derive"] }
boon = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
ego-tree = "0.11.0"
encoding_rs = "0.8.42"
scraper = { version = "0.27.0", default-features = false, features = ["deterministic"] }
cssparser = "0.37.0"
selectors = "0.38.0"
html5ever = "0.39.0"
tempfile = "3.27.0"
os_pipe = "1.2.3"
rustix = { version = "1.1.5", features = ["fs"] }
htmlcut-core = { path = "crates/htmlcut-core", version = "22.0.0" }
libfuzzer-sys = "0.4.13"
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
