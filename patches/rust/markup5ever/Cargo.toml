# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
publish = true
edition = "2021"
rust-version = "1.98.1"
name = "htmlcut-markup5ever"
version = "0.40.0-htmlcut.2"
authors = ["The html5ever Project Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Parser atom and sink types aligned with HTMLCut safety dependencies"
readme = false
categories = [
    "parser-implementations",
    "web-programming",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/resoltico/HTMLCut"

[features]
serde = ["web_atoms/serde"]

[lib]
name = "markup5ever"
path = "lib.rs"

[dependencies.log]
version = "0.4.34"

[dependencies.tendril]
package = "htmlcut-tendril"
path = "../tendril"
version = "0.5.1-htmlcut.2"

[dependencies.web_atoms]
version = "0.3.0"

# This owned upstream fork retains its upstream lint contract; workspace unsafe-code
# prohibition applies to first-party consumers, not the fork implementation.
[lints]
