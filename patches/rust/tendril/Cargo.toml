# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
publish = true
edition = "2021"
rust-version = "1.98.1"
name = "htmlcut-tendril"
version = "0.5.1-htmlcut.2"
authors = [
    "Keegan McAllister <mcallister.keegan@gmail.com>",
    "Simon Sapin <simon.sapin@exyr.org>",
    "Chris Morgan <me@chrismorgan.info>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Tendril buffer ownership with strict-provenance safeguards for HTMLCut"
readme = "NOTICE"
license = "MIT OR Apache-2.0"
repository = "https://github.com/resoltico/HTMLCut"

[features]
encoding_rs = ["dep:encoding_rs"]

[lib]
name = "tendril"
path = "src/lib.rs"

[dependencies.encoding_rs]
version = "0.8.42"
optional = true

[dependencies.new_debug_unreachable]
version = "1.0.6"

[dependencies.utf-8]
version = "0.7.6"

[dev-dependencies.criterion]
version = "0.8.2"

[dev-dependencies.rand]
version = "0.10.3"

# This owned upstream fork retains its upstream lint contract; workspace unsafe-code
# prohibition applies to first-party consumers, not the fork implementation.
[lints]
