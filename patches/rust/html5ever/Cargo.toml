# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
publish = true
edition = "2021"
rust-version = "1.98.1"
name = "htmlcut-html5ever"
version = "0.40.1-htmlcut.3"
authors = ["The html5ever Project Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "HTML5 parser with same-token bounded stopping safeguards for HTMLCut"
readme = "README.md"
keywords = [
    "html",
    "html5",
    "parser",
    "parsing",
]
categories = [
    "parser-implementations",
    "web-programming",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/resoltico/HTMLCut"

[features]
serde = ["markup5ever/serde"]
trace_tokenizer = []

[lib]
name = "html5ever"
path = "src/lib.rs"

[[example]]
name = "arena"
path = "examples/arena.rs"

[[example]]
name = "noop-tokenize"
path = "examples/noop-tokenize.rs"

[[example]]
name = "noop-tree-builder"
path = "examples/noop-tree-builder.rs"

[[example]]
name = "print-tree-actions"
path = "examples/print-tree-actions.rs"

[[example]]
name = "tokenize"
path = "examples/tokenize.rs"

[[test]]
name = "driver"
path = "tests/driver.rs"

[[bench]]
name = "html5ever"
path = "benches/html5ever.rs"
harness = false

[dependencies.memchr]
version = "2.8.2"

[dependencies.log]
version = "0.4.34"

[dependencies.markup5ever]
package = "htmlcut-markup5ever"
path = "../markup5ever"
version = "0.40.0-htmlcut.2"

[dev-dependencies.criterion]
version = "0.8.2"

[dev-dependencies.typed-arena]
version = "2.0.2"

# This owned upstream fork retains its upstream lint contract; workspace unsafe-code
# prohibition applies to first-party consumers, not the fork implementation.
[lints]
