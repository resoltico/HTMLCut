# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
publish = true
edition = "2024"
rust-version = "1.98.1"
name = "htmlcut-servo-arc"
version = "0.5.0-htmlcut.3"
authors = ["The Servo Project Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Servo Arc ownership with corrected mutable-tail provenance for HTMLCut"
readme = "NOTICE"
license = "MIT OR Apache-2.0"
repository = "https://github.com/resoltico/HTMLCut"

[lib]
name = "servo_arc"
path = "lib.rs"

[dependencies.serde]
version = "1.0.229"
optional = true

[dependencies.stable_deref_trait]
version = "1.2.1"

[features]
default = ["track_alloc_size"]
servo = [
    "serde",
    "track_alloc_size",
]
track_alloc_size = []

# This owned upstream fork retains its upstream lint contract; workspace unsafe-code
# prohibition applies to first-party consumers, not the fork implementation.
[lints]
