# SPDX-License-Identifier: MPL-2.0
[package]
publish = true
edition = "2024"
rust-version = "1.98.1"
name = "htmlcut-selectors"
version = "0.41.0-htmlcut.3"
authors = ["The Servo Project Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "CSS selector matching with bounded inner-work refusal for HTMLCut"
readme = "README.md"
keywords = [
    "css",
    "selectors",
]
license = "MPL-2.0"
repository = "https://github.com/resoltico/HTMLCut"

[lib]
name = "selectors"
path = "lib.rs"

[dependencies.bitflags]
version = "2.13.2"

[dependencies.cssparser]
version = "0.38.0"

[dependencies.derive_more]
version = "2.1.1"
features = [
    "add",
    "add_assign",
]

[dependencies.log]
version = "0.4.34"

[dependencies.new_debug_unreachable]
version = "1.0.6"


[dependencies.precomputed-hash]
version = "0.1.1"

[dependencies.rustc-hash]
version = "2.1.3"

[dependencies.servo_arc]
package = "htmlcut-servo-arc"
path = "../servo_arc"
version = "0.5.0-htmlcut.3"

[dependencies.smallvec]
version = "1.16.2"

# This owned upstream fork retains its upstream lint contract; workspace unsafe-code
# prohibition applies to first-party consumers, not the fork implementation.
[lints]
