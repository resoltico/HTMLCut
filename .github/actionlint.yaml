# dist 0.33.1 generates optional flag splitting and unquoted native-runner paths
# (SC2086), plus stylistic repeated redirects (SC2129). Keep its output generated;
# these exceptions apply only to that file. Handwritten workflows retain all checks.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:.+'
      - 'shellcheck reported issue in this script: SC2129:.+'
