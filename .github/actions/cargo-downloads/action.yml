name: Public Cargo downloads
description: Reuse public registry archives and index without caching owner configuration or sources
inputs:
  save:
    description: Whether this trusted source may save downloads after a successful job
    default: 'false'
runs:
  using: composite
  steps:
    - id: paths
      shell: python
      run: |
        import os
        from tools.htmlcut_maintenance.config import cargo_download_paths
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('paths<<CARGO_DOWNLOAD_PATHS\n'+'\n'.join(cargo_download_paths())+'\nCARGO_DOWNLOAD_PATHS\n')
    - if: inputs.save == 'true'
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/contributor-tools.toml') }}
        restore-keys: cargo-downloads-${{ runner.os }}-
    - if: inputs.save != 'true'
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/contributor-tools.toml') }}
        restore-keys: cargo-downloads-${{ runner.os }}-
