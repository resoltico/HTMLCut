# SPDX-License-Identifier: MPL-2.0
- name: Install license notice generator
  shell: bash
  run: cargo install cargo-about --version 0.9.2 --features cli --locked
- name: Generate third-party license notices
  shell: bash
  run: cargo about generate --locked --fail --manifest-path crates/htmlcut/Cargo.toml --config about.toml about.hbs -o THIRD-PARTY-LICENSES.html
