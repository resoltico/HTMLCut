name: V15 released-binary evaluation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [.github/workflows/v15-live-stress.yml]
  push:
    branches: [main]
    paths: [.github/workflows/v15-live-stress.yml]
permissions:
  contents: read
jobs:
  evaluate:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      EVAL_TARGET: ${{ matrix.target }}
    steps:
      - name: Verify released binary; run native controls and modest public GET checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime,hashlib,json,os,pathlib,platform,subprocess,sys,tarfile,time,urllib.request,zipfile
          root=pathlib.Path('evaluation-output');root.mkdir()
          target=os.environ['EVAL_TARGET'];suffix='.zip' if 'windows' in target else '.tar.gz'
          name='htmlcut-15.0.0-'+target+suffix
          bootstrap=root/'bootstrap.json'
          bootstrap.write_text(json.dumps({'status':'started','target':target}),encoding='utf-8')
          def bootstrap_failure(kind,error,traceback):
              bootstrap.write_text(json.dumps({'status':'failed','target':target,'error_type':kind.__name__,'message':str(error)},indent=2),encoding='utf-8')
              sys.__excepthook__(kind,error,traceback)
          sys.excepthook=bootstrap_failure
          def fetch(url,maximum=60*1024*1024):
              req=urllib.request.Request(url,headers={'User-Agent':'HTMLCut-release-evaluation/1.0','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  data=response.read(maximum+1)
                  if len(data)>maximum:raise ValueError('capture cap exceeded')
                  return data,{'status':response.status,'final_url':response.url,'content_type':response.headers.get('Content-Type'),'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          release=json.loads(subprocess.check_output(['gh','api','repos/resoltico/HTMLCut/releases/tags/v15.0.0'],timeout=25));asset=next(a for a in release['assets'] if a['name']==name)
          data,_=fetch(asset['browser_download_url']);digest=hashlib.sha256(data).hexdigest();assert asset['digest']=='sha256:'+digest
          archive=root/name;archive.write_bytes(data)
          if suffix=='.zip':
              with zipfile.ZipFile(archive) as z:z.extractall(root/'tool')
          else:
              with tarfile.open(archive) as t:t.extractall(root/'tool',filter='data')
          binary=next((root/'tool').rglob('htmlcut.exe' if 'windows' in target else 'htmlcut'));binary=binary.resolve();binary.chmod(0o755)
          bootstrap.write_text(json.dumps({'status':'complete','target':target,'archive_sha256':digest},indent=2),encoding='utf-8')
          sys.excepthook=sys.__excepthook__
          records=[]
          def run(label,args,html=None):
              start=time.perf_counter();record={'label':label,'arguments':args}
              try:
                  p=subprocess.run([str(binary),*args],input=html,capture_output=True,timeout=24)
                  record.update(exit_code=p.returncode,stdout=p.stdout.decode('utf-8','replace'),stderr=p.stderr.decode('utf-8','replace'))
              except subprocess.TimeoutExpired as e:record.update(timeout=True,stdout=(e.stdout or b'').decode('utf-8','replace'),stderr=(e.stderr or b'').decode('utf-8','replace'))
              record['seconds']=time.perf_counter()-start;records.append(record);return record
          run('version',['--version'])
          cases=[
            ('reference-link','<p>Before <a class="reference internal" href="relative.html">IMPORTANT</a> after.</p>','p','document_text'),
            ('policy-section','<article><p>BEGINNING</p><section id="policy"><h2>Policy terms</h2><p>IMPORTANT POLICY CONTENT</p></section><p>ENDING</p></article>','article','document_text'),
            ('caption-alt','<article><table><caption>Charges</caption><tr><td>EUR 180</td></tr></table><img src="x" alt="Broken mirror"></article>','article','document_text'),
            ('hidden','<div id="x">A<span hidden>B</span><span aria-hidden="true">C</span></div>','#x','dom_text'),
            ('template','<div id="x">A<template>T<template>N</template></template>B</div>','#x','dom_text'),
            ('duplicate','<p>A</p><p>B</p>','p','dom_text'),
            ('missing','<p>A</p>','h9','dom_text'),
            ('pre','<pre> x\n  y\n```\n</pre>','pre','document_text')]
          for label,html,css,projection in cases:run(label,['extract','--stdin','--css',css,'--projection',projection],html.encode())
          f=root/'space and Unicode Āžu 日本.html';f.write_text('<p>Fidelity €</p>',encoding='utf-8')
          run('unicode-file',['extract','--file',str(f),'--css','p','--raw'])
          run('invalid-utf8',['extract','--stdin','--css','p'],b'<p>\xff</p>')
          run('old-command',['select','--input-html','<p>x</p>','--css','p'])
          run('invalid-selector',['extract','--stdin','--css','['],b'<p>x</p>')
          run('raw-slice',['extract','--stdin','--start','START','--end','END','--raw'],'STARTé\r\nEND'.encode())
          if 'linux' in target:
              sources=[
                ('example','https://example.com/','h1','dom_text'),
                ('python','https://docs.python.org/3.13/whatsnew/3.13.html','#free-threaded-cpython','document_text'),
                ('rust','https://blog.rust-lang.org/2025/02/20/Rust-1.85.0/','h1','dom_text'),
                ('airbnb','https://www.airbnb.com/help/article/3145','h1','dom_text'),
                ('books','https://books.toscrape.com/','article.product_pod h3 a','attribute'),
                ('quotes-static','https://quotes.toscrape.com/','.quote .text','dom_text'),
                ('quotes-js','https://quotes.toscrape.com/js/','.quote .text','dom_text'),
                ('hackernews','https://news.ycombinator.com/','.titleline > a','attribute'),
                ('mdn','https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/a','h1','dom_text'),
                ('w3c','https://www.w3.org/TR/WCAG22/','h1','dom_text'),
                ('public-query','https://httpbingo.org/html?case=htmlcut15','h1','dom_text'),
                ('public-404','https://docs.python.org/3.13/whatsnew/htmlcut-not-a-page.html','h1','dom_text')]
              (root/'inputs').mkdir()
              manifest=[]
              for label,url,css,projection in sources:
                  args=['extract','--url',url,'--css',css,'--projection',projection]
                  if label in ['books','quotes-static','quotes-js','hackernews']:args+=['--match','all']
                  if projection=='attribute':args+=['--attribute','title' if label=='books' else 'href']
                  run(label+'-live-url',args)
                  try:
                      data,meta=fetch(url,12*1024*1024);path=root/'inputs'/(label+'.html');path.write_bytes(data)
                      meta.update(label=label,url=url,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),path=str(path));manifest.append(meta)
                      fileargs=args.copy();index=fileargs.index('--url');fileargs[index:index+2]=['--file',str(path),'--base-url',meta['final_url']]
                      run(label+'-captured-file',fileargs)
                  except Exception as exc:manifest.append({'label':label,'url':url,'error':str(exc)})
                  time.sleep(0.2)
              (root/'capture-manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          (root/'results.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'provenance.json').write_text(json.dumps({'target':target,'platform':platform.platform(),'python':platform.python_version(),'asset':name,'archive_sha256':digest,'release_tag':release['tag_name'],'release_published_at':release['published_at']},indent=2),encoding='utf-8')
          print(json.dumps([{'label':r['label'],'exit':r.get('exit_code'),'timeout':r.get('timeout',False),'seconds':round(r['seconds'],3)} for r in records],indent=2))
          PY
      - name: Retain observations including failed extraction results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v15-evaluation-${{ matrix.target }}
          path: evaluation-output
          retention-days: 7
          if-no-files-found: error
