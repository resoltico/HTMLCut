# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'extended' || 'standard' }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  FUZZ_NIGHTLY: nightly-2026-11-16
  FUZZ_TARGET: x86_64-unknown-linux-gnu
  CARGO_DENY_VERSION: 0.22.0
  CARGO_FUZZ_VERSION: 0.13.2
  CARGO_MUTANTS_VERSION: 27.1.0
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show
      - name: Check shared installer source and release staging
        run: |
          python3 install/check-sync.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s install -p '*_test.py'
          sh -n install/install.sh
          bash -n install/install_test.sh
      - name: Keep the minimum Rust version aligned with the development compiler
        shell: bash
        run: |
          minimum=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          compiler=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$compiler" ] || [ "$minimum" != "$compiler" ]; then
            echo 'Cargo.toml rust-version must match rust-toolchain.toml channel.' >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env: { RUSTDOCFLAGS: '-Dwarnings' }
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with: { tool: 'cargo-deny@${{ env.CARGO_DENY_VERSION }}' }
      - run: cargo deny check
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: '${{ matrix.target }}' }
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Delivered-binary conformance
        shell: bash
        run: |
          cargo build --locked --release -p htmlcut --target ${{ matrix.target }}
          binary="$PWD/target/${{ matrix.target }}/release/htmlcut"
          if [ "$RUNNER_OS" = Windows ]; then binary="$(cygpath -w "$binary.exe")"; fi
          HTMLCUT_TEST_BINARY="$binary" cargo test -p htmlcut --test conformance --locked --target ${{ matrix.target }}
      - name: Install the configured cargo-dist for native archive qualification
        shell: bash
        run: |
          dist_version=$(sed -n 's/^cargo-dist-version = "\(.*\)"/\1/p' dist-workspace.toml)
          test -n "$dist_version"
          if [ "$RUNNER_OS" = Windows ]; then
            curl --proto '=https' --proto-redir '=https' -fL -o target/cargo-dist-installer.ps1 "https://github.com/axodotdev/cargo-dist/releases/download/v${dist_version}/cargo-dist-installer.ps1"
            powershell -NoProfile -ExecutionPolicy ByPass -File "$(cygpath -w "$PWD/target/cargo-dist-installer.ps1")"
          else
            curl --proto '=https' --proto-redir '=https' -fL -o target/cargo-dist-installer.sh "https://github.com/axodotdev/cargo-dist/releases/download/v${dist_version}/cargo-dist-installer.sh"
            sh target/cargo-dist-installer.sh
          fi
      - name: Check exact release workflow generation and qualification overlay
        shell: bash
        run: python3 install/generate-release-workflow.py --check
      - name: Build native archives and stage checksum-bound installers
        shell: bash
        run: |
          about_version=$(sed -n 's/.*cargo install cargo-about --version \([^ ]*\).*/\1/p' .github/build-setup.yml)
          test -n "$about_version"
          cargo install cargo-about --version "$about_version" --features cli --locked
          cargo about generate --locked --fail --manifest-path crates/htmlcut/Cargo.toml --config about.toml about.hbs -o THIRD-PARTY-LICENSES.html
          export MACOSX_DEPLOYMENT_TARGET=12.0
          dist build --artifacts=local --target '${{ matrix.target }}'
          python3 install/prepare-test-release.py target/distrib --revision "$GITHUB_SHA"
      - name: Qualify native Unix installation and recovery
        if: runner.os != 'Windows'
        run: bash install/install_test.sh "$PWD/target/distrib"
      - name: Qualify native Windows installation and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/install_test.ps1 -Dist "$PWD/target/distrib"
  panic-abort:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo run --locked --release -p htmlcut-core --example parser_admission
        env: { RUSTFLAGS: '-Cpanic=abort' }
  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal --component rust-src
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with: { tool: 'cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: fuzz }
      - shell: bash
        run: |
          cp -R fuzz/corpus "$RUNNER_TEMP/htmlcut-fuzz-corpus"
          for source in fuzz/fuzz_targets/*.rs; do
            target=${source##*/}; target=${target%.rs}
            cargo +"$FUZZ_NIGHTLY" fuzz run --target "$FUZZ_TARGET" "$target" "$RUNNER_TEMP/htmlcut-fuzz-corpus/$target" -- -runs=2000 -max_len=65536 -rss_limit_mb=2048 -timeout=10
          done
          git diff --exit-code Cargo.lock
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: fuzz-smoke-artifacts, path: fuzz/artifacts, retention-days: 7 }
  mutants:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, conformance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with: { tool: 'cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}' }
      - name: Test a workspace mutation shard
        if: matrix.shard != 'conformance'
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          MUTATION_JOBS: ${{ strategy.job-total }}
        run: >-
          cargo mutants --workspace --exclude 'crates/htmlcut-conformance/**'
          --exclude-re windows_device --shard "$SHARD_INDEX/$((MUTATION_JOBS - 1))"
          --sharding round-robin
          --timeout-multiplier 5 -j 2 --cargo-arg=--locked
      - name: Test conformance helper mutations against their consumers
        if: matrix.shard == 'conformance'
        run: >-
          cargo mutants -p htmlcut-conformance --test-workspace=true
          --timeout-multiplier 5 -j 2 --cargo-arg=--locked
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'mutants-${{ matrix.shard }}', path: mutants.out, retention-days: 14 }
  mutants-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with: { tool: 'cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}' }
      - run: >-
          cargo mutants -p htmlcut --file crates/htmlcut/src/output.rs --re windows_device
          --timeout-multiplier 5 -j 2 --cargo-arg=--locked
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: mutants-windows, path: mutants.out, retention-days: 14 }
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal --component rust-src
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with: { tool: 'cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: fuzz }
      - shell: bash
        run: |
          cp -R fuzz/corpus "$RUNNER_TEMP/htmlcut-fuzz-corpus"
          for source in fuzz/fuzz_targets/*.rs; do
            target=${source##*/}; target=${target%.rs}
            cargo +"$FUZZ_NIGHTLY" fuzz run --target "$FUZZ_TARGET" "$target" "$RUNNER_TEMP/htmlcut-fuzz-corpus/$target" -- -max_total_time=600 -max_len=65536 -rss_limit_mb=2048 -timeout=10
          done
          git diff --exit-code Cargo.lock
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: fuzz-artifacts, path: fuzz/artifacts, retention-days: 7 }
  required-checks:
    name: Check
    if: always()
    needs: [check, test, panic-abort, fuzz-smoke, mutants, mutants-windows, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable CI jobs to pass
        env:
          CHECKS_PASSED: >-
            ${{ needs.check.result == 'success' &&
                needs.test.result == 'success' &&
                needs.panic-abort.result == 'success' &&
                needs.fuzz-smoke.result == 'success' &&
                needs.mutants-windows.result == 'success' &&
                (needs.mutants.result == 'success' || needs.mutants.result == 'skipped') &&
                (needs.fuzz.result == 'success' || needs.fuzz.result == 'skipped') }}
        run: test "$CHECKS_PASSED" = true
