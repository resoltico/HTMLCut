# SPDX-License-Identifier: MPL-2.0
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  FUZZ_NIGHTLY: nightly-2026-09-30
  FUZZ_TARGET: x86_64-unknown-linux-gnu
  CARGO_DENY_VERSION: 0.20.2
  CARGO_FUZZ_VERSION: 0.13.2
  CARGO_MUTANTS_VERSION: 27.1.0
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env: { RUSTDOCFLAGS: '-Dwarnings' }
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with: { tool: 'cargo-deny@${{ env.CARGO_DENY_VERSION }}' }
      - run: cargo deny check
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: '${{ matrix.target }}' }
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Delivered-binary conformance
        shell: bash
        run: |
          cargo build --locked --release -p htmlcut --target ${{ matrix.target }}
          binary="$PWD/target/${{ matrix.target }}/release/htmlcut"
          if [ "$RUNNER_OS" = Windows ]; then binary="$(cygpath -w "$binary.exe")"; fi
          HTMLCUT_TEST_BINARY="$binary" cargo test -p htmlcut --test conformance --locked --target ${{ matrix.target }}
  panic-abort:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo run --locked --release -p htmlcut-core --example parser_admission
        env: { RUSTFLAGS: '-Cpanic=abort' }
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - shell: bash
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: msrv }
      - run: cargo test --workspace --locked
  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal --component rust-src
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with: { tool: 'cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: fuzz }
      - shell: bash
        run: |
          cp -R fuzz/corpus "$RUNNER_TEMP/htmlcut-fuzz-corpus"
          for source in fuzz/fuzz_targets/*.rs; do
            target=${source##*/}; target=${target%.rs}
            cargo +"$FUZZ_NIGHTLY" fuzz run --target "$FUZZ_TARGET" "$target" "$RUNNER_TEMP/htmlcut-fuzz-corpus/$target" -- -runs=2000 -max_len=65536 -rss_limit_mb=2048 -timeout=10
          done
          git diff --exit-code Cargo.lock
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: fuzz-smoke-artifacts, path: fuzz/artifacts, retention-days: 7 }
  mutants:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with: { tool: 'cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}' }
      - run: cargo mutants --workspace --timeout 300 -j 2 --cargo-arg=--locked
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: mutants-out, path: mutants.out, retention-days: 14 }
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal --component rust-src
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with: { tool: 'cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: fuzz }
      - shell: bash
        run: |
          cp -R fuzz/corpus "$RUNNER_TEMP/htmlcut-fuzz-corpus"
          for source in fuzz/fuzz_targets/*.rs; do
            target=${source##*/}; target=${target%.rs}
            cargo +"$FUZZ_NIGHTLY" fuzz run --target "$FUZZ_TARGET" "$target" "$RUNNER_TEMP/htmlcut-fuzz-corpus/$target" -- -max_total_time=600 -max_len=65536 -rss_limit_mb=2048 -timeout=10
          done
          git diff --exit-code Cargo.lock
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: fuzz-artifacts, path: fuzz/artifacts, retention-days: 7 }
  required-checks:
    name: Check
    if: always()
    needs: [check, test, panic-abort, msrv, fuzz-smoke, mutants, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable CI jobs to pass
        env:
          CHECKS_PASSED: >-
            ${{ needs.check.result == 'success' &&
                needs.test.result == 'success' &&
                needs.panic-abort.result == 'success' &&
                needs.msrv.result == 'success' &&
                needs.fuzz-smoke.result == 'success' &&
                (needs.mutants.result == 'success' || needs.mutants.result == 'skipped') &&
                (needs.fuzz.result == 'success' || needs.fuzz.result == 'skipped') }}
        run: test "$CHECKS_PASSED" = true
