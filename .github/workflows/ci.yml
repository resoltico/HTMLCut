# SPDX-License-Identifier: MPL-2.0
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-target-matrix:
    name: Compute release target matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'matrix<<EOF'
            ./scripts/release-targets.sh matrix-json
            echo EOF
          } >> "$GITHUB_OUTPUT"
  linux-maintainer:
    name: Linux full maintainer gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - shell: bash
        run: |
          source ./scripts/contributor-rust-tools.sh
          cargo install cargo-deny --version "$(htmlcut_contributor_cargo_tool_inventory | awk '$1 == "cargo-deny" {print $2}')" --locked
      - run: ./check.sh
      - name: Strict provenance and ownership
        shell: bash
        run: |
          source ./scripts/contributor-rust-tools.sh
          rustup toolchain install "$HTMLCUT_CONTRIBUTOR_RUST_NIGHTLY_TOOLCHAIN" --component miri --component rust-src --profile minimal
          MIRIFLAGS=-Zmiri-strict-provenance cargo +"$HTMLCUT_CONTRIBUTOR_RUST_NIGHTLY_TOOLCHAIN" miri test --locked -p htmlcut-core --lib tests::selector_and_reading_contract_remain_miri_sound -- --exact
          MIRIFLAGS=-Zmiri-strict-provenance cargo +"$HTMLCUT_CONTRIBUTOR_RUST_NIGHTLY_TOOLCHAIN" miri test --locked -p htmlcut-servo-arc --lib
          MIRIFLAGS=-Zmiri-strict-provenance cargo +"$HTMLCUT_CONTRIBUTOR_RUST_NIGHTLY_TOOLCHAIN" miri test --locked -p htmlcut-tendril --lib subtendril
  focused-smoke:
    name: Linux bounded parser and relational smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          rustup toolchain install "$HTMLCUT_CONTRIBUTOR_RUST_NIGHTLY_TOOLCHAIN" --component rust-src --profile minimal
          cargo install cargo-fuzz --version "$(htmlcut_contributor_cargo_tool_inventory | awk '$1 == "cargo-fuzz" {print $2}')" --locked
      - name: Execute both bounded smokes
        shell: bash
        run: ./scripts/focused-smoke.sh "$RUNNER_TEMP/focused-smoke"
      - name: Preserve smoke logs and crash inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focused-smoke
          path: ${{ runner.temp }}/focused-smoke/
          if-no-files-found: warn

  semver:
    name: Published core API
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - shell: bash
        run: |
          source ./scripts/contributor-rust-tools.sh
          cargo install cargo-semver-checks --version "$(htmlcut_contributor_cargo_tool_inventory | awk '$1 == "cargo-semver-checks" {print $2}')" --locked
          cargo semver-checks check-release -p htmlcut-core --baseline-rev "$HTMLCUT_PUBLISHED_BASELINE_SOURCE"
  release-target-smoke:
    name: Native package ${{ matrix.id }}
    needs: [release-target-matrix]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-target-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - if: ${{ matrix.needs_musl_tools }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup target add "${{ matrix.target_triple }}"
          source ./scripts/contributor-rust-tools.sh
          cargo install cargo-about --version "$(htmlcut_contributor_cargo_tool_inventory | awk '$1 == "cargo-about" {print $2}')" --locked --features cli
          ./scripts/build-release-artifact.sh "${{ matrix.target_triple }}"
          source ./scripts/release-targets.sh
          version=$(./scripts/workspace-version.sh Cargo.toml)
          package=$(release_package_name_for_target "$version" "${{ matrix.target_triple }}")
          smoke_shell="$BASH"
          if command -v cygpath >/dev/null 2>&1; then smoke_shell="$(cygpath -w "$smoke_shell")"; fi
          python3 scripts/native-package-evidence.py --package "dist/$package" --version "$version" \
            --target "${{ matrix.target_triple }}" --source-sha "$(git rev-parse HEAD)" \
            --output "dist/native-evidence-${{ matrix.id }}.json" --smoke-log "dist/native-smoke-${{ matrix.id }}.log" --shell "$smoke_shell"
      - name: Execute immutable published native install instructions
        shell: bash
        run: |
          source ./scripts/contributor-rust-tools.sh
          python3 scripts/verify-published-install.py --source-sha "$HTMLCUT_PUBLISHED_BASELINE_SOURCE" --output dist/published-install-example.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
  check:
    name: Check
    if: always()
    needs: [release-target-matrix, linux-maintainer, focused-smoke, release-target-smoke, semver]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-results.py
