# SPDX-License-Identifier: MPL-2.0
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-target-matrix:
    name: Compute release target matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'matrix<<EOF'
            ./scripts/release-targets.sh matrix-json
            echo EOF
          } >> "$GITHUB_OUTPUT"
  linux-maintainer:
    name: Linux full maintainer gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-deny
      - run: ./check.sh

  focused-smoke:
    name: Linux contract and extraction fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          rustup toolchain install "$HTMLCUT_CONTRIBUTOR_RUST_NIGHTLY_TOOLCHAIN" --component rust-src --profile minimal
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-fuzz
      - name: Execute both bounded smokes
        shell: bash
        run: ./scripts/focused-smoke.sh "$RUNNER_TEMP/focused-smoke"
      - name: Preserve smoke logs and crash inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focused-smoke
          path: ${{ runner.temp }}/focused-smoke/
          if-no-files-found: warn

  minimum-rust:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          msrv=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" test --locked --workspace
  release-target-smoke:
    name: Native package ${{ matrix.id }}
    needs: [release-target-matrix]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-target-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - if: ${{ matrix.needs_musl_tools }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-about
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup target add "${{ matrix.target_triple }}"
          source ./scripts/contributor-rust-tools.sh
          ./scripts/build-release-artifact.sh "${{ matrix.target_triple }}"
          source ./scripts/release-targets.sh
          version=$(./scripts/workspace-version.sh Cargo.toml)
          package=$(release_package_name_for_target "$version" "${{ matrix.target_triple }}")
          cargo test --locked --workspace --target "${{ matrix.target_triple }}"
          ./scripts/smoke-release-artifact.sh "${{ matrix.target_triple }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
  check:
    name: Check
    if: always()
    needs: [release-target-matrix, linux-maintainer, focused-smoke, release-target-smoke, minimum-rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-results.py
