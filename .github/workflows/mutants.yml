# SPDX-License-Identifier: MPL-2.0
name: Mutation testing

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation-plan:
    if: github.event_name != 'pull_request'
    name: Plan cargo-mutants shards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      shards: ${{ steps.shards.outputs.shards }}
      mutant_count: ${{ steps.shards.outputs.mutant_count }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record selected source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          htmlcut_contributor_retry 3 5 htmlcut_contributor_rustup_toolchain_install \
            "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_TOOLCHAIN}" \
            "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_COMPONENTS[@]}"

      - name: Export mutation tool inventory
        id: mutation_tools
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          echo "tool_csv=$(htmlcut_contributor_install_action_csv cargo-mutants)" >> "$GITHUB_OUTPUT"

      - name: Install cargo-mutants
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: ${{ steps.mutation_tools.outputs.tool_csv }}

      - name: Export complete shard plan
        id: shards
        shell: bash
        run: |
          set -euo pipefail
          cargo mutants --config .cargo/mutants.toml --workspace --list --json > "$RUNNER_TEMP/mutants.json"
          ./scripts/verify-mutation-scope.sh "$RUNNER_TEMP/mutants.json"
          mutant_count="$(jq 'length' "$RUNNER_TEMP/mutants.json")"
          if (( mutant_count == 0 )); then
            echo "full mutation corpus is empty" >&2
            exit 1
          fi
          shards="$(./scripts/mutation-shard-plan.sh)"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "mutant_count=$mutant_count" >> "$GITHUB_OUTPUT"

      - name: Bind the complete selected inventory
        shell: bash
        env:
          MUTATION_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selected-mutation-plan"
          cp "$RUNNER_TEMP/mutants.json" "$RUNNER_TEMP/selected-mutation-plan/plan.json"
          python3 scripts/verify-mutation-results.py --record-plan \
            --plan "$RUNNER_TEMP/selected-mutation-plan/plan.json" \
            --metadata "$RUNNER_TEMP/selected-mutation-plan/source.json" \
            --source-sha "$MUTATION_SOURCE_SHA"

      - name: Preserve selected inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selected-mutation-plan
          path: ${{ runner.temp }}/selected-mutation-plan/
          if-no-files-found: error
          retention-days: 14

  mutants:
    if: github.event_name != 'pull_request'
    needs: mutation-plan
    name: cargo-mutants (${{ matrix.shard.selector }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.mutation-plan.outputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          htmlcut_contributor_retry 3 5 htmlcut_contributor_rustup_toolchain_install \
            "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_TOOLCHAIN}" \
            "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_COMPONENTS[@]}"
          htmlcut_contributor_retry 3 5 rustup toolchain install \
            "${HTMLCUT_CONTRIBUTOR_RUST_NIGHTLY_TOOLCHAIN}" --profile minimal

      - name: Export mutation tool inventory
        id: mutation_tools
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          echo "tool_csv=$(htmlcut_contributor_install_action_csv cargo-mutants)" >> "$GITHUB_OUTPUT"

      - name: Install cargo-mutants
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: ${{ steps.mutation_tools.outputs.tool_csv }}

      - name: Resolve Cargo build cache directory
        id: cargo_cache
        shell: bash
        run: python3 scripts/cargo-build-cache-path.py >> "$GITHUB_OUTPUT"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: htmlcut-mutation-workspace
          workspaces: ". -> ../.htmlcut-artifacts/target"
          cache-directories: ${{ steps.cargo_cache.outputs.build }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run mutation shard
        shell: bash
        run: ./scripts/xtask.sh mutants --in-place --shard "${{ matrix.shard.selector }}"

      - name: Stage mutation results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/../.htmlcut-artifacts/mutation-runs/mutants.out"
          stage_dir="$RUNNER_TEMP/htmlcut-mutation-results"
          test -d "$source_dir"
          mkdir -p "$stage_dir"
          cp -R "$source_dir" "$stage_dir/mutants.out"
          git rev-parse HEAD > "$stage_dir/mutants.out/source-commit.txt"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.shard.artifact_name }}
          path: ${{ runner.temp }}/htmlcut-mutation-results
          if-no-files-found: error

  mutation-diff-plan:
    if: github.event_name == 'pull_request'
    name: Plan cargo-mutants pull-request diff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      has_mutants: ${{ steps.diff.outputs.has_mutants }}
      shards: ${{ steps.diff.outputs.shards }}
      mutant_count: ${{ steps.diff.outputs.mutant_count }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Record selected source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          htmlcut_contributor_retry 3 5 htmlcut_contributor_rustup_toolchain_install \
            "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_TOOLCHAIN}" \
            "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_COMPONENTS[@]}"

      - name: Export mutation tool inventory
        id: mutation_tools
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          echo "tool_csv=$(htmlcut_contributor_install_action_csv cargo-mutants)" >> "$GITHUB_OUTPUT"

      - name: Install cargo-mutants
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: ${{ steps.mutation_tools.outputs.tool_csv }}

      - name: Select pull-request diff shards
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          cargo mutants --config .cargo/mutants.toml --workspace --list --json > "$RUNNER_TEMP/full-mutants.json"
          ./scripts/verify-mutation-scope.sh "$RUNNER_TEMP/full-mutants.json"
          diff_path="$RUNNER_TEMP/htmlcut-mutants.diff"
          git diff --no-ext-diff --unified=0 "${{ github.event.pull_request.base.sha }}" HEAD > "$diff_path"
          set +e
          cargo mutants --config .cargo/mutants.toml --workspace --in-diff "$diff_path" --list --json > "$RUNNER_TEMP/mutants.json"
          mutants_status=$?
          set -e
          if (( mutants_status != 0 && mutants_status != 4 )); then
            exit "$mutants_status"
          fi
          if [[ ! -s "$RUNNER_TEMP/mutants.json" ]]; then
            printf '[]\n' > "$RUNNER_TEMP/mutants.json"
          fi
          ./scripts/verify-mutation-scope.sh --subset \
            "$RUNNER_TEMP/mutants.json" "$RUNNER_TEMP/full-mutants.json"
          mutant_count="$(jq 'length' "$RUNNER_TEMP/mutants.json")"
          if (( mutant_count == 0 )); then
            echo "has_mutants=false" >> "$GITHUB_OUTPUT"
            echo "shards=[]" >> "$GITHUB_OUTPUT"
            echo "mutant_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shard_count="$mutant_count"
          if (( shard_count > 16 )); then
            shard_count=16
          fi
          shards="$(./scripts/mutation-shard-plan.sh "$shard_count")"
          echo "has_mutants=true" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "mutant_count=$mutant_count" >> "$GITHUB_OUTPUT"

      - name: Bind the complete selected inventory
        shell: bash
        env:
          MUTATION_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selected-mutation-plan"
          cp "$RUNNER_TEMP/mutants.json" "$RUNNER_TEMP/selected-mutation-plan/plan.json"
          python3 scripts/verify-mutation-results.py --record-plan \
            --plan "$RUNNER_TEMP/selected-mutation-plan/plan.json" \
            --metadata "$RUNNER_TEMP/selected-mutation-plan/source.json" \
            --source-sha "$MUTATION_SOURCE_SHA"

      - name: Preserve selected inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selected-mutation-plan
          path: ${{ runner.temp }}/selected-mutation-plan/
          if-no-files-found: error
          retention-days: 14

  mutants-diff:
    if: github.event_name == 'pull_request' && needs.mutation-diff-plan.outputs.has_mutants == 'true'
    needs: mutation-diff-plan
    name: cargo-mutants (pull-request diff ${{ matrix.shard.selector }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-diff-plan.outputs.shards) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.mutation-diff-plan.outputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          htmlcut_contributor_retry 3 5 htmlcut_contributor_rustup_toolchain_install \
            "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_TOOLCHAIN}" \
            "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_COMPONENTS[@]}"
          htmlcut_contributor_retry 3 5 rustup toolchain install \
            "${HTMLCUT_CONTRIBUTOR_RUST_NIGHTLY_TOOLCHAIN}" --profile minimal

      - name: Export mutation tool inventory
        id: mutation_tools
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          echo "tool_csv=$(htmlcut_contributor_install_action_csv cargo-mutants)" >> "$GITHUB_OUTPUT"

      - name: Install cargo-mutants
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: ${{ steps.mutation_tools.outputs.tool_csv }}

      - name: Resolve Cargo build cache directory
        id: cargo_cache
        shell: bash
        run: python3 scripts/cargo-build-cache-path.py >> "$GITHUB_OUTPUT"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: htmlcut-mutation-workspace
          workspaces: ". -> ../.htmlcut-artifacts/target"
          cache-directories: ${{ steps.cargo_cache.outputs.build }}
          save-if: false

      - name: Run mutations in changed Rust code
        shell: bash
        run: |
          set -euo pipefail
          diff_path="$RUNNER_TEMP/htmlcut-mutants.diff"
          git diff --no-ext-diff --unified=0 "${{ github.event.pull_request.base.sha }}" HEAD > "$diff_path"
          ./scripts/xtask.sh mutants --in-place --shard "${{ matrix.shard.selector }}" --in-diff "$diff_path"

      - name: Stage mutation results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/../.htmlcut-artifacts/mutation-runs/mutants.out"
          stage_dir="$RUNNER_TEMP/htmlcut-mutation-results"
          test -d "$source_dir"
          mkdir -p "$stage_dir"
          cp -R "$source_dir" "$stage_dir/mutants.out"
          git rev-parse HEAD > "$stage_dir/mutants.out/source-commit.txt"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.shard.artifact_name }}
          path: ${{ runner.temp }}/htmlcut-mutation-results
          if-no-files-found: error

  mutation-diff-summary:
    if: github.event_name == 'pull_request' && always()
    needs: [mutation-diff-plan, mutants-diff]
    name: cargo-mutants pull-request summary
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.mutation-diff-plan.outputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download the selected source-bound inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: selected-mutation-plan
          path: selected-mutation-plan/

      - name: Download mutation results
        if: needs.mutation-diff-plan.outputs.has_mutants == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cargo-mutants-shard-*-of-*
          path: mutation-artifacts
          merge-multiple: false

      - name: Verify complete shards and summarize results
        shell: bash
        env:
          MUTATION_DIFF_HAS_MUTANTS: ${{ needs.mutation-diff-plan.outputs.has_mutants }}
          MUTATION_SHARDS: ${{ needs.mutation-diff-plan.outputs.shards }}
          MUTATION_SOURCE_SHA: ${{ needs.mutation-diff-plan.outputs.source_sha }}
          MUTATION_EXPECTED_TOTAL: ${{ needs.mutation-diff-plan.outputs.mutant_count }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.mutation-diff-plan.result }}" != "success" ]]; then
            echo "pull-request mutation planning did not complete successfully" >&2
            exit 1
          fi
          python3 scripts/verify-mutation-results.py \
            --plan selected-mutation-plan/plan.json \
            --metadata selected-mutation-plan/source.json \
            --source-sha "$MUTATION_SOURCE_SHA" \
            --shards "$MUTATION_SHARDS" --artifacts mutation-artifacts
          [[ "$MUTATION_DIFF_HAS_MUTANTS" == "true" || "$MUTATION_DIFF_HAS_MUTANTS" == "false" ]] || exit 1
          if [[ "$MUTATION_DIFF_HAS_MUTANTS" == "false" ]]; then
            [[ "$MUTATION_EXPECTED_TOTAL" == "0" ]] || exit 1
            [[ "${{ needs.mutants-diff.result }}" == "skipped" ]] || exit 1
            echo "No production Rust mutants overlap this pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./scripts/summarize-mutation-results.sh \
            "$MUTATION_SHARDS" \
            mutation-artifacts \
            "$GITHUB_STEP_SUMMARY" \
            "$MUTATION_EXPECTED_TOTAL"

          if [[ "${{ needs.mutants-diff.result }}" != "success" ]]; then
            echo "one or more pull-request mutation shards did not complete successfully" >&2
            exit 1
          fi

  mutation-summary:
    if: github.event_name != 'pull_request' && always()
    needs: [mutation-plan, mutants]
    name: cargo-mutants summary
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.mutation-plan.outputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download the selected source-bound inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: selected-mutation-plan
          path: selected-mutation-plan/

      - name: Download mutation results
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cargo-mutants-shard-*-of-*
          path: mutation-artifacts
          merge-multiple: false

      - name: Verify complete shards and summarize results
        if: always()
        shell: bash
        env:
          MUTATION_SHARDS: ${{ needs.mutation-plan.outputs.shards }}
          MUTATION_SOURCE_SHA: ${{ needs.mutation-plan.outputs.source_sha }}
          MUTATION_EXPECTED_TOTAL: ${{ needs.mutation-plan.outputs.mutant_count }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.mutation-plan.result }}" != "success" ]]; then
            echo "full mutation planning did not complete successfully" >&2
            exit 1
          fi
          python3 scripts/verify-mutation-results.py \
            --plan selected-mutation-plan/plan.json \
            --metadata selected-mutation-plan/source.json \
            --source-sha "$MUTATION_SOURCE_SHA" \
            --shards "$MUTATION_SHARDS" --artifacts mutation-artifacts
          ./scripts/summarize-mutation-results.sh \
            "$MUTATION_SHARDS" \
            mutation-artifacts \
            "$GITHUB_STEP_SUMMARY" \
            "$MUTATION_EXPECTED_TOTAL"

          if [[ "${{ needs.mutants.result }}" != "success" ]]; then
            echo "one or more mutation shards did not complete successfully" >&2
            exit 1
          fi
