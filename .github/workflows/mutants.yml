name: Mutation testing

on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - ".cargo/mutants.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "patches/rust/**/*.rs"
      - "patches/rust/**/Cargo.toml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation-plan:
    if: github.event_name != 'pull_request'
    name: Plan cargo-mutants shards
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.shards.outputs.shards }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Export complete shard plan
        id: shards
        shell: bash
        run: |
          set -euo pipefail
          shards="$(./scripts/mutation-shard-plan.sh)"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  mutants:
    if: github.event_name != 'pull_request'
    needs: mutation-plan
    name: cargo-mutants (${{ matrix.shard.selector }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          retry() {
            local attempts="$1"
            local delay_seconds="$2"
            shift 2
            local attempt=1
            until "$@"; do
              if (( attempt >= attempts )); then
                return 1
              fi
              sleep "${delay_seconds}"
              attempt=$((attempt + 1))
            done
          }
          retry 3 5 rustup toolchain install "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_TOOLCHAIN}" --profile minimal

      - name: Export mutation tool inventory
        id: mutation_tools
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          echo "tool_csv=$(htmlcut_contributor_install_action_csv cargo-mutants)" >> "$GITHUB_OUTPUT"

      - name: Install cargo-mutants
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: ${{ steps.mutation_tools.outputs.tool_csv }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.shard.artifact_name }}
          workspaces: ". -> ../.htmlcut-artifacts/target"

      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          cargo mutants --config .cargo/mutants.toml --list --json > "$RUNNER_TEMP/mutants.json"
          jq -e '
            length > 0
            and ([.[].package] | unique == ["htmlcut-cli", "htmlcut-core", "htmlcut-tempdir"])
            and all(.[];
              (.file | test("^crates/(htmlcut-cli|htmlcut-core|htmlcut-tempdir)/src/"))
              and (.file | test("/src/(tests/|.*/tests/)") | not)
            )
          ' "$RUNNER_TEMP/mutants.json" >/dev/null

      - name: Run mutation shard
        shell: bash
        run: ./scripts/xtask.sh mutants --in-place --shard "${{ matrix.shard.selector }}"

      - name: Stage mutation results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/../.htmlcut-artifacts/mutation-runs/mutants.out"
          stage_dir="$RUNNER_TEMP/htmlcut-mutation-results"
          test -d "$source_dir"
          mkdir -p "$stage_dir"
          cp -R "$source_dir" "$stage_dir/mutants.out"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.shard.artifact_name }}
          path: ${{ runner.temp }}/htmlcut-mutation-results
          if-no-files-found: error

  mutants-diff:
    if: github.event_name == 'pull_request'
    name: cargo-mutants (pull-request diff)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          rustup toolchain install "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_TOOLCHAIN}" --profile minimal

      - name: Export mutation tool inventory
        id: mutation_tools
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          echo "tool_csv=$(htmlcut_contributor_install_action_csv cargo-mutants)" >> "$GITHUB_OUTPUT"

      - name: Install cargo-mutants
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: ${{ steps.mutation_tools.outputs.tool_csv }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants-pr-diff
          workspaces: ". -> ../.htmlcut-artifacts/target"

      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          cargo mutants --config .cargo/mutants.toml --list --json > "$RUNNER_TEMP/mutants.json"
          jq -e '
            length > 0
            and ([.[].package] | unique == ["htmlcut-cli", "htmlcut-core", "htmlcut-tempdir"])
            and all(.[];
              (.file | test("^crates/(htmlcut-cli|htmlcut-core|htmlcut-tempdir)/src/"))
              and (.file | test("/src/(tests/|.*/tests/)") | not)
            )
          ' "$RUNNER_TEMP/mutants.json" >/dev/null

      - name: Run mutations in changed Rust code
        shell: bash
        run: |
          set -euo pipefail
          diff_path="$RUNNER_TEMP/htmlcut-mutants.diff"
          git diff --no-ext-diff --unified=0 "${{ github.event.pull_request.base.sha }}" HEAD > "$diff_path"
          ./scripts/xtask.sh mutants --in-place --in-diff "$diff_path"

      - name: Stage mutation results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/../.htmlcut-artifacts/mutation-runs/mutants.out"
          stage_dir="$RUNNER_TEMP/htmlcut-mutation-results"
          test -d "$source_dir"
          mkdir -p "$stage_dir"
          cp -R "$source_dir" "$stage_dir/mutants.out"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-mutants-pr-diff
          path: ${{ runner.temp }}/htmlcut-mutation-results
          if-no-files-found: error

  mutation-summary:
    if: github.event_name != 'pull_request' && always()
    needs: [mutation-plan, mutants]
    name: cargo-mutants summary
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download mutation results
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          pattern: cargo-mutants-shard-*-of-*
          path: mutation-artifacts
          merge-multiple: false

      - name: Verify complete shards and summarize results
        if: always()
        shell: bash
        env:
          MUTATION_SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          set -euo pipefail
          ./scripts/summarize-mutation-results.sh \
            "$MUTATION_SHARDS" \
            mutation-artifacts \
            "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.mutants.result }}" != "success" ]]; then
            echo "one or more mutation shards did not complete successfully" >&2
            exit 1
          fi
