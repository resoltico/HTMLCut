# SPDX-License-Identifier: MPL-2.0
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build, publish, and verify (for example v15.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Serialize publications across tags as well as retries; an older draft cannot race latest.
  group: publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-target-matrix:
    name: Compute release target matrix
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      version: ${{ steps.source.outputs.version }}

    steps:
      - name: Validate release tag before checkout
        id: candidate
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.candidate.outputs.tag }}

      - name: Resolve and validate one immutable source commit
        id: source
        shell: bash
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="$(./scripts/release-tag.sh "$CANDIDATE_TAG")"
          [[ "$(git cat-file -t "refs/tags/$TAG")" == "tag" ]]
          SOURCE_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          {
            echo "source_sha=$SOURCE_SHA"
            echo "release_tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Require completed verification of this exact main source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SOURCE_SHA" -f branch=main -f per_page=100 > "$RUNNER_TEMP/release-ci.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/mutants.yml/runs" \
            -f head_sha="$RELEASE_SOURCE_SHA" -f branch=main -f per_page=100 > "$RUNNER_TEMP/release-mutants.json"
          python3 scripts/check-release-verification.py --source-sha "$RELEASE_SOURCE_SHA" \
            --ci "$RUNNER_TEMP/release-ci.json" --mutations "$RUNNER_TEMP/release-mutants.json"

      - name: Export release target matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-targets.sh
          {
            echo 'matrix<<EOF'
            release_matrix_json
            echo EOF
          } >> "$GITHUB_OUTPUT"

  build-archives:
    name: Build release archives
    needs: [release-target-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.release-target-matrix.outputs.release_tag }}
      RELEASE_SOURCE_SHA: ${{ needs.release-target-matrix.outputs.source_sha }}
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-target-matrix.outputs.source_sha }}

      - name: Resolve target release tag and version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(./scripts/release-tag.sh "$RELEASE_TAG")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create release archives from the validated source
        shell: bash
        run: ./scripts/build-source-archives.sh "${{ needs.release-target-matrix.outputs.source_sha }}" dist

      - name: Generate source archive attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/htmlcut-source-${{ steps.release.outputs.version }}.zip
            dist/htmlcut-source-${{ steps.release.outputs.version }}.tar.gz

      - name: Upload archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-standalone:
    name: Build standalone ${{ matrix.id }} package
    needs:
      - release-target-matrix
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ needs.release-target-matrix.outputs.release_tag }}
      RELEASE_SOURCE_SHA: ${{ needs.release-target-matrix.outputs.source_sha }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-target-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-target-matrix.outputs.source_sha }}

      - name: Install Linux musl toolchain packages
        if: ${{ matrix.needs_musl_tools }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          rustup toolchain install "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_TOOLCHAIN}" --profile minimal
          rustup target add --toolchain "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_TOOLCHAIN}" "${{ matrix.target_triple }}"

      - name: Resolve Cargo build cache directory
        id: cargo_cache
        shell: bash
        run: python3 scripts/cargo-build-cache-path.py >> "$GITHUB_OUTPUT"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> ../.htmlcut-artifacts/target"
          cache-directories: ${{ steps.cargo_cache.outputs.build }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.target_triple }}

      - name: Resolve target release tag and version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(./scripts/release-tag.sh "$RELEASE_TAG")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve artifact names
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-targets.sh
          VERSION="${{ steps.release.outputs.version }}"
          echo "package=$(release_package_name_for_target "$VERSION" "${{ matrix.target_triple }}")" >> "$GITHUB_OUTPUT"
          echo "compiled_binary=$(binary_name_for_target "${{ matrix.target_triple }}")" >> "$GITHUB_OUTPUT"

      - name: Install native attribution tool
        shell: bash
        run: ./scripts/install-contributor-cargo-tools.sh cargo-about

      - name: Build standalone executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-release-artifact.sh "${{ matrix.target_triple }}"

      - name: Verify native package and bind source evidence
        shell: bash
        run: |
          set -euo pipefail
          smoke_shell="$BASH"
          if command -v cygpath >/dev/null 2>&1; then
            smoke_shell="$(cygpath -w "$smoke_shell")"
          fi
          python3 scripts/native-package-evidence.py \
            --package "dist/${{ steps.artifact.outputs.package }}" \
            --version "${{ steps.release.outputs.version }}" \
            --target "${{ matrix.target_triple }}" --source-sha "$RELEASE_SOURCE_SHA" \
            --output "dist/native-evidence-${{ matrix.id }}.json" \
            --smoke-log "dist/native-smoke-${{ matrix.id }}.log" --shell "$smoke_shell"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.artifact.outputs.package }}

      - name: Upload standalone artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_bundle_name }}
          path: |
            dist/${{ steps.artifact.outputs.package }}
            dist/native-evidence-${{ matrix.id }}*.json
            dist/native-smoke-${{ matrix.id }}.log
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.release-target-matrix.outputs.release_tag }}
      RELEASE_SOURCE_SHA: ${{ needs.release-target-matrix.outputs.source_sha }}
    needs:
      - release-target-matrix
      - build-archives
      - build-standalone
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # All assets and publication metadata use the commit resolved once above.
          ref: ${{ needs.release-target-matrix.outputs.source_sha }}

      - name: Resolve target release tag and version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(./scripts/release-tag.sh "$RELEASE_TAG")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download archive artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: dist/

      - name: Download standalone artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          path: dist/
          merge-multiple: true

      - name: Build checksum manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/build-release-checksums.sh

      - name: Generate checksum manifest attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/htmlcut-${{ steps.release.outputs.version }}-checksums.txt

      - name: Publish GitHub release idempotently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/publish-github-release.sh

      - name: Verify GitHub release handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/verify-github-release.sh

  published-native:
    name: Execute published package ${{ matrix.id }}
    needs: [release-target-matrix, release]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-target-matrix.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ needs.release-target-matrix.outputs.release_tag }}
      RELEASE_SOURCE_SHA: ${{ needs.release-target-matrix.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-target-matrix.outputs.source_sha }}

      - name: Install Linux musl toolchain packages
        if: ${{ matrix.needs_musl_tools }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Rust toolchain for native I/O tests
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/contributor-rust-tools.sh
          rustup toolchain install "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_TOOLCHAIN}" --profile minimal
          rustup target add --toolchain "${HTMLCUT_CONTRIBUTOR_RUST_STABLE_TOOLCHAIN}" "${{ matrix.target_triple }}"
          ./scripts/xtask.sh hygiene verify

      - name: Download public bytes anonymously and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-targets.sh
          VERSION="${RELEASE_TAG#v}"
          PACKAGE="$(release_package_name_for_target "$VERSION" "${{ matrix.target_triple }}")"
          CHECKSUM="htmlcut-${VERSION}-checksums.txt"
          mkdir -p dist
          for NAME in "$PACKAGE" "$CHECKSUM"; do
            curl --fail --location --max-time 120 --max-filesize 134217728 \
              --output "dist/$NAME" "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$NAME"
          done
          python3 - "$PACKAGE" "$CHECKSUM" <<'PY'
          import runpy,sys
          from pathlib import Path
          helpers=runpy.run_path('scripts/release-assets.py')
          package=Path('dist')/sys.argv[1]
          checksums=helpers['parse_checksums']((Path('dist')/sys.argv[2]).read_bytes())
          assert helpers['digest'](package)[1]==checksums[package.name], 'Public package checksum differs'
          PY
          gh attestation verify "dist/$PACKAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$RELEASE_SOURCE_SHA" --format json > dist/published-attestation.json

      - name: Execute downloaded native package and retain its binding
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-targets.sh
          VERSION="${RELEASE_TAG#v}"
          PACKAGE="$(release_package_name_for_target "$VERSION" "${{ matrix.target_triple }}")"
          smoke_shell="$BASH"
          if command -v cygpath >/dev/null 2>&1; then
            smoke_shell="$(cygpath -w "$smoke_shell")"
          fi
          python3 scripts/native-package-evidence.py \
            --package "dist/$PACKAGE" --version "$VERSION" \
            --target "${{ matrix.target_triple }}" --source-sha "$RELEASE_SOURCE_SHA" \
            --output dist/published-native-evidence.json --smoke-log dist/published-native-smoke.log \
            --shell "$smoke_shell"

      - name: Preserve downloaded package and complete native proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-native-${{ matrix.id }}
          path: |
            dist/htmlcut-*
            dist/published-*.json
            dist/published-native-smoke.log
          if-no-files-found: error
          retention-days: 7
