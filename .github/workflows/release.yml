# SPDX-License-Identifier: MPL-2.0
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated stable release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publication-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release-target-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Validate tag syntax before checkout
        id: candidate
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.candidate.outputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Admit exact annotated main source and latest same-source push CI
        id: source
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable,'-m','tools.htmlcut_maintenance','release','identity',os.environ['CANDIDATE_TAG'],'--require-ci','--output',os.environ['RUNNER_TEMP']+'/release-identity.json'],check=True)
      - id: matrix
        shell: python
        run: |
          import json, os
          from tools.htmlcut_maintenance.config import matrix
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('matrix='+json.dumps(matrix())+'\n')
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-identity
          path: ${{ runner.temp }}/release-identity.json
          if-no-files-found: warn
  build-archives:
    needs: [release-target-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-target-matrix.outputs.source_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - env:
          SOURCE_SHA: ${{ needs.release-target-matrix.outputs.source_sha }}
        shell: python
        run: |
          import os
          from tools.htmlcut_maintenance.release.source import archives
          archives('.',os.environ['SOURCE_SHA'],'dist')
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/htmlcut-source-${{ needs.release-target-matrix.outputs.version }}.zip
            dist/htmlcut-source-${{ needs.release-target-matrix.outputs.version }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error
  build-standalone:
    needs: [release-target-matrix]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-target-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-target-matrix.outputs.source_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/cargo-downloads
      - if: ${{ matrix.needs_musl_tools }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools acl
      - name: Install native toolchain
        shell: python
        run: |
          import subprocess
          from tools.htmlcut_maintenance.config import toolchain
          subprocess.run(['rustup','toolchain','install',toolchain(),'--profile','minimal'],check=True)
          subprocess.run(['rustup','target','add','--toolchain',toolchain(),'${{ matrix.target_triple }}'],check=True)
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-about
      - name: Build and accept exact native package before provenance/publication
        id: package
        shell: python
        run: |
          import os
          from tools.htmlcut_maintenance.release.package import build
          from tools.htmlcut_maintenance.release.accept import accept
          package=build('${{ matrix.target_triple }}','dist')
          accept(package,'${{ matrix.target_triple }}','${{ needs.release-target-matrix.outputs.version }}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('name='+package.name+'\n')
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.package.outputs.name }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_bundle_name }}
          path: dist/
          if-no-files-found: error
      - name: Preserve bounded installation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installation-build-standalone-${{ matrix.id }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/htmlcut-cargo-tools/*/*.log
            ${{ runner.temp }}/htmlcut-cargo-tools/*/*.json
            ${{ runner.temp }}/htmlcut-tool-version/*/*.log
            ${{ runner.temp }}/htmlcut-tool-version/*/*.json
            ${{ runner.temp }}/htmlcut-tool-build-*/*.log
            ${{ runner.temp }}/htmlcut-tool-build-*/*.json
          if-no-files-found: warn
  release:
    needs: [release-target-matrix, build-archives, build-standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_SOURCE_SHA: ${{ needs.release-target-matrix.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.release-target-matrix.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-target-matrix.outputs.source_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          path: dist/
          merge-multiple: true
      - shell: python
        run: |
          import os
          from tools.htmlcut_maintenance.release.checksums import write
          write(os.environ['RELEASE_TAG'][1:],'dist')
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/htmlcut-${{ needs.release-target-matrix.outputs.version }}-checksums.txt
      - name: Converge immutable release bytes without editing published retries
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os
          from tools.htmlcut_maintenance.release.publish import publish
          publish(os.environ['RELEASE_TAG'],'dist')
  published-native:
    needs: [release-target-matrix, release]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-target-matrix.outputs.matrix) }}
    env:
      RELEASE_SOURCE_SHA: ${{ needs.release-target-matrix.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.release-target-matrix.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-target-matrix.outputs.source_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/cargo-downloads
      - if: ${{ matrix.needs_musl_tools }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools acl
      - name: Verify anonymous public bytes, attestation and native execution
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable,'-m','tools.htmlcut_maintenance','release','verify',os.environ['RELEASE_TAG'],'--target','${{ matrix.target_triple }}','--output','dist'],check=True)
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-native-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
