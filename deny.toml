# SPDX-License-Identifier: MPL-2.0
[graph]
all-features = true

[advisories]
ignore = []
yanked = "deny"
unmaintained = "all"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93
exceptions = [
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Permit source-only private/dev paths so Cargo omits the unpublished test helper
# from packaged manifests. Registry and public production wildcards remain denied.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = [
    { crate = "phf@0.13.1", reason = "Maintained cssparser/selectors require PHF 0.13 while fixed html5ever 0.40.1 uses web_atoms/string_cache on PHF 0.14; retain this exact graph exception until upstream constraints converge." },
    { crate = "phf_codegen@0.13.1", reason = "Maintained cssparser/selectors require PHF 0.13 while fixed html5ever 0.40.1 uses web_atoms/string_cache on PHF 0.14; retain this exact graph exception until upstream constraints converge." },
    { crate = "phf_generator@0.13.1", reason = "Maintained cssparser/selectors require PHF 0.13 while fixed html5ever 0.40.1 uses web_atoms/string_cache on PHF 0.14; retain this exact graph exception until upstream constraints converge." },
    { crate = "phf_shared@0.13.1", reason = "Maintained cssparser/selectors require PHF 0.13 while fixed html5ever 0.40.1 uses web_atoms/string_cache on PHF 0.14; retain this exact graph exception until upstream constraints converge." },
    { crate = "syn@2.0.119", reason = "Current upstream proc-macro dependencies still require syn 2 while current serde and ref-cast use syn 3; keep this exact exception until those remaining upstream dependencies converge on syn 3." },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
