[dependencies.cssparser]
version = "0.38.0"

[dependencies.ego-tree]
version = "0.11.0"

[dependencies.regex]
version = "1.13.1"

[dependencies.schemars]
version = "1.2.2"

[dependencies.scraper]
default-features = false
features = ["errors"]
package = "htmlcut-scraper"
path = "vendor/scraper"
version = "0.27.0-htmlcut.1"

[dependencies.selectors]
package = "htmlcut-selectors"
path = "vendor/selectors"
version = "0.38.0-htmlcut.1"

[dependencies.serde]
features = ["derive"]
version = "1.0.229"

[dependencies.serde_json]
version = "1.0.151"

[dependencies.serde_path_to_error]
version = "0.1.20"

[dependencies.sha2]
default-features = false
package = "htmlcut-sha2"
path = "vendor/sha2"
version = "0.11.0-htmlcut.1"

[dependencies.thiserror]
version = "2.0.21"

[dependencies.url]
version = "2.5.8"

[[example]]
name = "extraction_plan"
path = "examples/extraction_plan.rs"

[[example]]
name = "prepared_engine_benchmark"
path = "examples/prepared_engine_benchmark.rs"

[[example]]
name = "prepared_task_timing"
path = "examples/prepared_task_timing.rs"

[[example]]
name = "snapshot_reuse"
path = "examples/snapshot_reuse.rs"

[features]
default = []

[lib]
name = "htmlcut_core"
path = "src/lib.rs"

[lints.clippy]
all = "warn"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[package]
authors = ["Ervins Strauhmanis"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
description = "Library for extracting and inspecting HTML with CSS selectors, literal or regex slicing, and structured diagnostics."
edition = "2024"
license = "MPL-2.0"
name = "htmlcut-core"
publish = false
readme = false
repository = "https://github.com/resoltico/HTMLCut"
rust-version = "1.98.1"
version = "19.0.0"

[[test]]
name = "contract_inline_markdown"
path = "tests/contract_inline_markdown.rs"

[[test]]
name = "contract_markdown"
path = "tests/contract_markdown.rs"

[[test]]
name = "contract_records"
path = "tests/contract_records.rs"

[[test]]
name = "contract_row_groups"
path = "tests/contract_row_groups.rs"

[workspace]
